name: Publish catalog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bonoware-catalog-pages
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_sha == github.sha
    permissions:
      pages: read
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          case "$GITHUB_EVENT_NAME:$source" in
            workflow_dispatch:*|push:workflow|workflow_run:legacy) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
          esac
  build:
    needs: source
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
